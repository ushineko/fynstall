# The multi-target example. Run `make greet` first: it builds the program
# for each target into build/<os>-<arch>/.
app:
  id: io.ushineko.greet
  name: Greet
  version: 0.1.0
  publisher: ushineko

payload:
  # {os}, {arch} and {exe} resolve per target when the installer is built.
  - src: build/{os}-{arch}/greet{exe}
    dst: bin/greet{exe}
  - src: notes/arm64.txt
    dst: share/arm64.txt
    targets: [linux/arm64]

integration:
  # A block list, not [bin/greet{exe}]: inside [...] YAML reads "{" as the
  # start of a mapping. Quote it there: ["bin/greet{exe}"].
  path_links:
    - bin/greet{exe}

# Values come from --greeting=… and friends, from fynstall-params.yml beside
# the installer, from a prompt, or from the default, in that order.
parameters:
  - name: greeting
    label: Greeting
    default: hello
  - name: name
    label: Your name
  - name: token
    label: Access token
    secret: true

actions:
  - config_file:
      path: "{config}/io.ushineko.greet/config.json"
      values:
        greeting: "{param:greeting}"
        name: "{param:name}"
        token: "{param:token}"

targets: [linux/amd64, linux/arm64, windows/amd64]
