# The config every fynstall test and desk check builds. Run `make hello`
# first: it builds the program into bin/ here.
app:
  id: io.ushineko.hello
  name: Hello
  version: 0.1.0
  publisher: ushineko
  icon: hello.png
  licence: LICENSE

install:
  # The first is the default. System scope installs for everyone on the
  # computer and asks for an administrator once. {programs} is where the
  # platform keeps programs: ~/.local/share or /opt on Linux,
  # %LOCALAPPDATA%\Programs on Windows.
  scopes: [user, system]
  dir:
    user: "{programs}/{id}"
    system: "{programs}/{id}"

payload:
  # {exe} is ".exe" for a Windows target and nothing elsewhere.
  - src: bin/hello{exe}
    dst: bin/hello{exe}
  - src: README.md
    dst: share/doc/README.md

ui:
  launch: bin/hello{exe}      # the finish page offers to start it

integration:
  path_links: ["bin/hello{exe}"]
  desktop:
    - name: Hello
      comment: The example program fynstall installs
      exec: bin/hello{exe}
      categories: [Utility]
  keep_on_uninstall:
    - "{config}/io.ushineko.hello"
