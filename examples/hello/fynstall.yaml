# The config every fynstall test and desk check builds. Run `make hello`
# first: it builds the program into bin/ here.
app:
  id: io.ushineko.hello
  name: Hello
  version: 0.1.0
  publisher: ushineko
  icon: hello.png
  licence: LICENSE

install:
  # The first is the default. System scope installs for everyone on the
  # computer, under /opt, and asks for an administrator once.
  scopes: [user, system]
  dir:
    user: "{data}/{id}"
    system: "/opt/{id}"

payload:
  - src: bin/hello
    dst: bin/hello
  - src: README.md
    dst: share/doc/README.md

ui:
  launch: bin/hello      # the finish page offers to start it

integration:
  path_links: [bin/hello]
  desktop:
    - name: Hello
      comment: The example program fynstall installs
      exec: bin/hello
      categories: [Utility]
  keep_on_uninstall:
    - "{config}/io.ushineko.hello"
