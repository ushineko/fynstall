# The example of install-time actions (spec 002 phase 4a). Build beacon
# with `make beacon`, then run `fynstall build --cli-only` here.
app:
  id: io.ushineko.beacon
  name: Beacon
  version: 0.1.0
  publisher: ushineko

install:
  # On Linux: per user, a systemd user unit; for everyone, a system unit.
  # On Windows a service is for the whole computer, so only the install for
  # everyone (--scope system) has one.
  scopes: [user, system]

payload:
  # {exe} is ".exe" for a Windows target and nothing elsewhere.
  - src: bin/beacon{exe}
    dst: bin/beacon{exe}

integration:
  # Where an older version's data is moved to; the uninstaller leaves it.
  keep_on_uninstall:
    - "{data}/{id}/data"

actions:
  # Data an older beacon kept elsewhere moves into the kept directory.
  - migrate:
      from: "{data}/beacon-0"
      to: "{data}/{id}/data"
  # A systemd unit, or a Windows service; the uninstaller stops and removes
  # it.
  - service:
      name: beacon
      description: Beacon, the fynstall example service
      exec: bin/beacon{exe}
      args: [serve]
  # A payload program run at install, and its undo at uninstall.
  - run:
      exec: bin/beacon{exe}
      args: [setup, "{config}/beacon/setup-done"]
      undo: [teardown, "{config}/beacon/setup-done"]
  # Runs before the uninstaller removes anything.
  - run:
      on: uninstall
      exec: bin/beacon{exe}
      args: [goodbye]
